<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un jugo cada día · 365 recetas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,0)}
:root{--primary:#ff6b35;--accent:#f7931e;--grad:linear-gradient(135deg,#ff6b35,#f7931e);
 --bg:#fff6ee;--bg2:#ffe6d1;--neb1:rgba(255,107,53,.18);--neb2:rgba(247,147,30,.16);
 --card:#ffffff;--card2:#fff0e3;--line:rgba(90,40,10,.14);--text:#2b1a10;--muted:#7b6253;--star:rgba(255,107,53,.35);
 --shadow:0 10px 28px rgba(140,70,20,.14);--onprimary:#fff;--ok:#1f9d63}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0a0616;--bg2:#160c2b;--neb1:rgba(120,60,220,.30);--neb2:rgba(255,107,53,.16);
 --card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.10);--line:rgba(255,255,255,.14);--text:#f6f0ff;--muted:#b9acd3;--star:rgba(255,255,255,.75);
 --shadow:0 10px 30px rgba(0,0,0,.45);--ok:#3ddc97}}
:root[data-theme="dark"]{
 --bg:#0a0616;--bg2:#160c2b;--neb1:rgba(120,60,220,.30);--neb2:rgba(255,107,53,.16);
 --card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.10);--line:rgba(255,255,255,.14);--text:#f6f0ff;--muted:#b9acd3;--star:rgba(255,255,255,.75);
 --shadow:0 10px 30px rgba(0,0,0,.45);--ok:#3ddc97}
:root[data-theme="light"]{
 --bg:#fff6ee;--bg2:#ffe6d1;--neb1:rgba(255,107,53,.18);--neb2:rgba(247,147,30,.16);
 --card:#ffffff;--card2:#fff0e3;--line:rgba(90,40,10,.14);--text:#2b1a10;--muted:#7b6253;--star:rgba(255,107,53,.35);
 --shadow:0 10px 28px rgba(140,70,20,.14);--ok:#1f9d63}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.55;min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;line-height:1.1;margin:0;letter-spacing:-.01em}
p{margin:0}
.galaxy{position:fixed;inset:0;z-index:0;pointer-events:none;background:
 radial-gradient(900px 600px at 85% -10%,var(--neb1),transparent 62%),
 radial-gradient(800px 600px at -10% 105%,var(--neb2),transparent 62%),linear-gradient(var(--bg),var(--bg2))}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:
 radial-gradient(1.6px 1.6px at 24px 34px,var(--star),transparent 55%),radial-gradient(1px 1px at 96px 128px,var(--star),transparent 55%),
 radial-gradient(1.4px 1.4px at 170px 64px,var(--star),transparent 55%),radial-gradient(1px 1px at 236px 188px,var(--star),transparent 55%),
 radial-gradient(1.2px 1.2px at 60px 200px,var(--star),transparent 55%);background-size:270px 230px;animation:tw 7s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.45}to{opacity:1}}
.hidden{display:none!important}
button{font:inherit;color:inherit}
.clickable,button,label.btn,summary{cursor:pointer;touch-action:manipulation}
button,.clickable{-webkit-tap-highlight-color:rgba(0,0,0,0)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{min-height:48px;padding:0 24px;border:0;border-radius:50px;background:var(--grad);color:var(--onprimary);font-weight:700;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 22px rgba(255,107,53,.35);text-align:center}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line);box-shadow:none}
.btn.sm{padding:0 18px;font-size:.92rem}
.btn.on{background:var(--ok);box-shadow:none;color:#fff}
.ico{width:48px;height:48px;min-height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:1.3rem;flex:none}
.chip{min-height:48px;padding:0 18px;border-radius:50px;border:1.5px solid var(--line);background:var(--card);font-weight:500;font-size:.95rem;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.chip small{color:var(--muted);font-size:.78rem}
.chip.on{background:var(--c,var(--primary));border-color:transparent;color:#fff;font-weight:700}
.chip.on small{color:rgba(255,255,255,.85)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
input[type=search],input[type=text],textarea,select{width:100%;min-height:52px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font:inherit;padding:12px 16px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.eyebrow{color:var(--accent);font-weight:700;font-size:.86rem;letter-spacing:.02em}
.muted{color:var(--muted)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.sec{margin-top:34px}
.sec>h2{font-size:1.5rem;margin-bottom:14px}
.quote{border-left:5px solid var(--primary);background:var(--card);border-radius:0 20px 20px 0;padding:18px 20px;font-family:'Bricolage Grotesque',sans-serif;font-size:1.25rem;font-weight:500;line-height:1.3}
.quote span{display:block;font-family:'DM Sans',sans-serif;font-size:.85rem;color:var(--muted);margin-top:8px;font-weight:400}
/* layout */
#side{position:fixed;left:0;top:0;bottom:0;width:248px;z-index:20;padding:22px 14px;background:var(--card);border-right:1px solid var(--line);display:none;flex-direction:column;gap:6px;overflow-y:auto;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#side .brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.35rem;line-height:1.05;text-align:left;background:none;border:0;padding:6px 10px 14px;color:var(--text)}
#side .brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.nb{min-height:48px;display:flex;align-items:center;gap:12px;padding:0 14px;border-radius:14px;border:0;background:transparent;font-weight:500;text-align:left;width:100%}
.nb.on{background:var(--grad);color:#fff;font-weight:700}
#side .foot{margin-top:auto;padding:14px 10px 0;font-size:.78rem;color:var(--muted)}
#top{position:fixed;top:0;left:0;right:0;z-index:30;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
#top .pw{flex:1;min-width:0}
#top .pl{font-size:.78rem;color:var(--muted);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:10px;border-radius:10px;background:var(--card2);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--grad);border-radius:10px;transition:width .5s ease}
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
#bnav button{flex:1;min-height:52px;background:transparent;border:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:.7rem;color:var(--muted)}
#bnav button span{font-size:1.25rem;line-height:1}
#bnav button.on{color:var(--primary);font-weight:700}
.wrap{position:relative;z-index:1}
main{max-width:980px;margin:0 auto;padding:calc(84px + env(safe-area-inset-top)) 16px 120px}
@media(min-width:900px){#side{display:flex}#bnav{display:none}.wrap{margin-left:248px}#top{left:248px}main{padding-bottom:60px}}
/* welcome */
#welcome{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#0a0616,#1d0f3a 55%,#3a1408);color:#f6f0ff;text-align:center;overflow-y:auto}
#welcome .in{max-width:560px;margin:auto}
#welcome .orb{width:120px;height:120px;border-radius:50%;margin:0 auto 22px;background:radial-gradient(circle at 35% 30%,#ffd08a,#ff6b35 55%,#c0350c);box-shadow:0 0 80px rgba(255,107,53,.65);animation:float 4.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
#welcome h1{font-size:clamp(2.6rem,9vw,4.4rem);font-weight:800}
#welcome h1 b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#welcome .big{font-family:'Bricolage Grotesque',sans-serif;font-size:1.35rem;margin:18px 0 6px;font-weight:500}
#welcome .sub{color:#c9bde3;margin-bottom:26px}
#welcome .num{display:flex;gap:10px;justify-content:center;margin-bottom:26px;flex-wrap:wrap}
#welcome .num div{border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:10px 16px;font-weight:700}
#welcome .num small{display:block;font-weight:400;color:#c9bde3;font-size:.75rem}
/* home */
.hero h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;margin:6px 0 10px}
.hero .lead{color:var(--muted);max-width:56ch}
.today{position:relative;border-radius:24px;padding:24px;border:1px solid var(--line);background:linear-gradient(145deg,var(--card2),var(--card));box-shadow:var(--shadow);overflow:hidden;margin-top:22px}
.today::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--c)}
.today h2{font-size:clamp(1.7rem,5vw,2.4rem);margin:8px 0 10px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tag{font-size:.8rem;padding:4px 12px;border-radius:50px;border:1px solid var(--line);color:var(--muted)}
.tag.c{background:var(--c);border-color:transparent;color:#fff;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:22px}
.stat{padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.stat b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:2rem;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:.85rem;color:var(--muted)}
.ch{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;min-height:60px}
.ch .cb{width:48px;height:48px;min-height:48px;border-radius:14px;border:2px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex:none}
.ch .cb.on{background:var(--ok);border-color:transparent;color:#fff}
.ch .tx{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;min-height:48px}
.ch .tx b{display:block}.ch .tx small{color:var(--muted)}
/* recipe cards */
.rcard{display:flex;gap:12px;align-items:center;padding:12px 12px 12px 0;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;overflow:hidden;min-height:76px}
.rcard .rd{width:64px;flex:none;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--c);color:#fff;font-size:.72rem;margin:-12px 0 -12px 0}
.rcard .rd b{font-family:'Bricolage Grotesque',sans-serif;font-size:1.5rem;line-height:1}
.rcard .rb{flex:1;min-width:0}
.rcard .rt{font-weight:700;line-height:1.2}
.rcard .rm{color:var(--muted);font-size:.85rem;margin-top:2px}
.rcard .miss{font-size:.82rem;margin-top:4px;color:var(--accent)}
.more{display:flex;justify-content:center;margin:18px 0}
.count{color:var(--muted);margin:10px 2px}
/* detail */
#detail{position:fixed;inset:0;z-index:100}
#detail .back{position:absolute;inset:0;background:rgba(5,2,15,.72)}
#dsheet{position:absolute;right:0;bottom:0;top:0;width:min(760px,100%);background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 40px;box-shadow:-10px 0 40px rgba(0,0,0,.5)}
@media(min-width:900px){#dsheet{border-left:1px solid var(--line)}}
.dhead{position:relative;padding:calc(18px + env(safe-area-inset-top)) 20px 20px;background:var(--c);background:linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 45%,#12082a));color:#fff}
.dhead h2{font-size:clamp(1.8rem,6vw,2.6rem);margin:10px 0 10px;color:#fff}
.dhead .tag{border-color:rgba(255,255,255,.4);color:#fff}
.dhead .tag.c{background:rgba(255,255,255,.22)}
.dbar{display:flex;gap:8px;justify-content:space-between;align-items:center}
.dbar .ico{background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.3);color:#fff}
.dbody{padding:20px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:18px}
.meta div{padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.meta small{display:block;color:var(--muted);font-size:.75rem}
.meta b{font-size:1rem}
.dots{color:var(--primary);letter-spacing:2px}
.dots i{color:var(--line);font-style:normal}
.dbody h3{font-size:1.25rem;margin:22px 0 10px}
.ing{list-style:none;margin:0;padding:0}
.ing li{padding:10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:6px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:4px 0 12px 46px}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.box{padding:14px 16px;border-radius:16px;background:var(--card);border-left:5px solid var(--c,var(--primary));margin-top:10px}
.box b{display:block;margin-bottom:2px}
.kcal{display:flex;gap:12px;flex-wrap:wrap}
.kcal div{flex:1;min-width:130px;padding:14px;border-radius:16px;background:var(--card2);text-align:center}
.kcal b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:1.9rem;line-height:1.1}
.kcal small{color:var(--muted)}
details{border-radius:16px;background:var(--card);border:1px solid var(--line);margin-top:10px}
details>summary{min-height:52px;padding:14px 18px;font-weight:700;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";font-size:1.5rem;color:var(--primary);font-weight:500;line-height:1}
details[open]>summary::after{content:"–"}
details>.dc{padding:0 18px 16px;color:var(--text)}
.ntable{width:100%;border-collapse:collapse;font-size:.95rem}
.ntable td{padding:8px 4px;border-bottom:1px solid var(--line)}
.ntable td:last-child{text-align:right;font-weight:700}
.photo{width:100%;border-radius:18px;display:block;max-height:420px;object-fit:cover}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0}
.legal{font-size:.8rem;color:var(--muted);margin-top:26px}
/* ingredients */
.tray{display:flex;gap:8px;flex-wrap:wrap;min-height:20px;margin:10px 0}
.gh{font-weight:700;margin:16px 0 6px;color:var(--accent)}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
/* cart */
.crow{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:6px;min-height:60px}
.crow .cb{width:48px;height:48px;min-height:48px;border-radius:12px;border:2px solid var(--line);background:transparent;font-size:1.2rem;display:flex;align-items:center;justify-content:center;flex:none}
.crow .cb.on{background:var(--ok);border-color:transparent;color:#fff}
.crow.dn .nm{text-decoration:line-through;color:var(--muted)}
.crow .nm{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;min-height:48px;display:flex;flex-direction:column;justify-content:center}
.crow .nm small{color:var(--muted)}
.crow .q{font-weight:700;text-align:right;color:var(--primary)}
.step{display:flex;gap:6px;align-items:center}
.step b{min-width:34px;text-align:center}
/* reading */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.prose h2{font-size:1.9rem;margin:6px 0 12px}
.prose h3{font-size:1.15rem;margin:22px 0 8px}
.prose p{margin-bottom:12px;max-width:66ch}
.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.months button{min-height:64px;text-align:left;padding:10px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.months small{display:block;color:var(--muted)}
/* carousel */
.car{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.car::-webkit-scrollbar{display:none}
.slide{flex:0 0 min(84%,420px);scroll-snap-align:center;min-height:300px;border-radius:24px;padding:26px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:var(--shadow)}
.slide .em{font-size:3rem}
.slide h3{font-size:1.7rem;margin:6px 0 10px}
.slide p{opacity:.95}
.slide .n{font-size:.85rem;opacity:.8}
.dotsr{display:flex;gap:8px;justify-content:center;margin-top:6px}
.dotsr i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dotsr i.on{background:var(--primary);width:26px;border-radius:9px}
/* test */
.opt{display:flex;width:100%;min-height:56px;text-align:left;align-items:center;gap:12px;padding:10px 18px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);margin-bottom:10px;font-weight:500;font-size:1.02rem}
.qbar{height:8px;border-radius:8px;background:var(--card2);overflow:hidden;margin-bottom:18px}
.qbar i{display:block;height:100%;background:var(--grad);transition:width .3s}
/* diary */
.mood{display:flex;gap:8px;margin:10px 0}
.mood button{width:52px;height:52px;min-height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:1.5rem}
.mood button.on{background:var(--grad);border-color:transparent}
.entry{padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:10px}
.entry .eh{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:6px;color:var(--muted);font-size:.88rem}
.entry p{white-space:pre-wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:300;background:#1c1233;color:#fff;padding:12px 20px;border-radius:50px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-weight:500;max-width:90vw;text-align:center;pointer-events:none}
@media(min-width:900px){#toast{bottom:30px}}
#more{position:fixed;inset:0;z-index:90}
#more .back{position:absolute;inset:0;background:rgba(5,2,15,.6)}
#more .sh{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
body.lock{overflow:hidden}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="galaxy"></div><div class="stars"></div>

<div id="welcome">
 <div class="in">
  <div class="orb"></div>
  <h1>Un jugo<br><b>cada día</b></h1>
  <p class="big">Un año para probar algo nuevo.</p>
  <p class="sub">365 recetas para disfrutar, nutrirte y descubrir una combinación diferente cada día.</p>
  <div class="num"><div>365<small>recetas</small></div><div>3<small>métodos</small></div><div>4<small>estaciones</small></div></div>
  <button class="btn" style="font-size:1.1rem;min-height:56px;padding:0 34px" onclick="A.enter()">¡Empezar el desafío!</button>
  <p class="sub" style="margin-top:18px;font-size:.85rem">Creado por Verónica Seeber</p>
 </div>
</div>

A.cclear=function(){S.cart={};S.custom=[];S.checked={};LS.set('cart',S.cart);LS.set('custom',S.custom);LS.set('checked',S.checked);VIEWS.cart();toast('Lista vaciada')};
function cartText(){var agg={};Object.keys(S.cart).forEach(function(d){var m=S.cart[d];R[d-1].i.forEach(function(x){agg[x[0]]=(agg[x[0]]||0)+x[1]*m})});
 var t='🛒 Lista de compras · Un jugo cada día\n';G.forEach(function(g,gi){var ids=Object.keys(agg).map(Number).filter(function(i){return C[i].g===gi}).sort(function(a,b){return C[a].l.localeCompare(C[b].l,'es')});if(!ids.length)return;t+='\n'+g+'\n';ids.forEach(function(i){t+='- '+C[i].l+': '+fq(i,agg[i])+'\n'})});
 if(S.custom.length){t+='\nOtros\n';S.custom.forEach(function(c){t+='- '+c.t+'\n'})}return t}
A.ccopy=function(){var t=cartText();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('📋 Lista copiada')},function(){fallbackCopy(t)})}else fallbackCopy(t)};
function fallbackCopy(t){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.top='0';a.style.opacity='0';document.body.appendChild(a);a.focus();a.select();try{document.execCommand('copy');toast('📋 Lista copiada')}catch(e){toast('No se pudo copiar')}document.body.removeChild(a)}
A.cwa=function(){window.open('https://wa.me/?text='+encodeURIComponent(cartText()),'_blank')};

/* ---------- TIPS ---------- */
VIEWS.tips=function(){
 var g=GENTIPS.map(function(t){return '<details><summary>'+esc(t[0])+'</summary><div class="dc">'+esc(t[1])+'</div></details>'}).join('');
 var ck=CHECK.map(function(t,i){return '<div class="ch"><button class="cb'+(S.guide[i]?' on':'')+'" aria-label="Marcar" onclick="A.gck('+i+')">'+(S.guide[i]?'✓':'')+'</button><button class="tx" onclick="A.gck('+i+')">'+esc(t)+'</button></div>'}).join('');
 $('v-tips').innerHTML='<h1 style="font-size:2.2rem;margin-bottom:6px">Tips</h1><p class="muted" style="margin-bottom:16px">Los consejos del libro para que cada jugo te salga mejor.</p>'
 +quoteHTML(2)+'<div class="sec"><h2>Antes de preparar</h2><div id="gck">'+ck+'</div></div>'
 +'<div class="sec"><h2>Consejos de cocina</h2>'+g+'</div>'
 +'<div class="sec"><h2>El tip de cada receta</h2><input id="tq" type="search" placeholder="Buscar en los tips…" oninput="A.tq(this.value)" value="'+esc(S.tq)+'"><div id="tcats" style="margin-top:8px"></div><div id="tcount" class="count"></div><div id="tlist"></div><div id="tmore" class="more"></div></div>';updTips()};
function updTips(){var cats=[['','Todos']].concat(Object.keys(CAT).map(function(k){return [k,CAT[k].n,CAT[k].col]}));$('tcats').innerHTML=chipRow(cats,S.tcat,'A.tcat');
 var q=norm(S.tq.trim()),l=R.filter(function(r){return (!S.tcat||r.c===S.tcat)&&(!q||norm(r.tip+' '+r.n).indexOf(q)>-1)});
 $('tcount').textContent=l.length+' tips';$('tlist').innerHTML=l.slice(0,S.tn).map(function(r){return '<div class="card clickable" style="margin-bottom:10px;padding:16px;border-left:5px solid '+CAT[r.c].col+'" onclick="A.open('+r.d+')"><p class="eyebrow">Día '+r.d+' · '+esc(r.n)+'</p><p style="margin-top:4px">'+esc(r.tip)+'</p></div>'}).join('');
 $('tmore').innerHTML=l.length>S.tn?'<button class="btn ghost" onclick="A.tmoreb()">Ver más ('+(l.length-S.tn)+')</button>':''}
A.tq=function(v){S.tq=v;S.tn=24;updTips()};A.tcat=function(v){S.tcat=v;S.tn=24;updTips()};A.tmoreb=function(){S.tn+=30;updTips()};
A.gck=function(i){if(S.guide[i])delete S.guide[i];else S.guide[i]=1;LS.set('guide',S.guide);VIEWS.tips();};

/* ---------- LECTURA ---------- */
VIEWS.read=function(){var c=CHAPS[S.chap];
 var tabs='<div class="tabs">'+CHAPS.map(function(x,i){return '<button class="chip'+(i===S.chap?' on':'')+'" onclick="A.chap('+i+')">'+x.e+' '+esc(x.t)+'</button>'}).join('')+'</div>';
 var b='<div class="prose"><h2>'+esc(c.t)+'</h2>';
 if(c.months){b+='<p class="muted" style="margin-bottom:14px">Tocá un mes para ver sus recetas.</p><div class="months">'+YEAR.map(function(m,i){return '<button onclick="A.month('+i+')"><b>'+m[0]+'</b><small>Días '+m[1]+' al '+m[2]+' · páginas '+m[3]+' a '+m[4]+' del libro</small></button>'}).join('')+'</div>'}
 else c.b.forEach(function(x){if(x.h)b+='<h3>'+esc(x.h)+'</h3>';else if(x.p)b+='<p>'+esc(x.p)+'</p>';else if(x.q)b+='<div class="quote" style="margin:16px 0">“'+esc(x.q)+'”</div>';else if(x.cards){b+='<div class="grid g2" style="margin:10px 0">'+x.cards.map(function(k){return '<div class="card"><h3 style="margin:0 0 6px">'+esc(k[0])+'</h3><p style="margin:0">'+esc(k[1])+'</p></div>'}).join('')+'</div>'}});
 b+='</div><div class="row spread" style="margin-top:22px">'+(S.chap>0?'<button class="btn ghost" onclick="A.chap('+(S.chap-1)+')">‹ Anterior</button>':'<span></span>')+(S.chap<CHAPS.length-1?'<button class="btn" onclick="A.chap('+(S.chap+1)+')">Siguiente ›</button>':'<button class="btn" onclick="A.go(\'recipes\')">Ir a las recetas</button>')+'</div>';
 $('v-read').innerHTML='<h1 style="font-size:2.2rem;margin-bottom:10px">Lectura</h1>'+tabs+b};
A.chap=function(i){S.chap=i;VIEWS.read();window.scrollTo(0,0)};
A.month=function(i){S.f={q:'',cat:'',met:'',est:'',mes:String(i),flags:{},sort:'dia',n:40};A.go('recipes')};

/* ---------- CONCEPTOS ---------- */
VIEWS.cards=function(){
 $('v-cards').innerHTML='<h1 style="font-size:2.2rem;margin-bottom:6px">Conceptos clave</h1><p class="muted" style="margin-bottom:16px">Tocá cada tarjeta para abrirla.</p>'+CARDS.map(function(c){return '<details><summary><span>'+c[0]+' '+esc(c[1])+'</span></summary><div class="dc">'+esc(c[2])+'</div></details>'}).join('')+'<div class="sec">'+quoteHTML(4)+'</div>'};

/* ---------- LECCIONES (carrusel) ---------- */
VIEWS.lessons=function(){
 $('v-lessons').innerHTML='<h1 style="font-size:2.2rem;margin-bottom:6px">Lecciones clave</h1><p class="muted" style="margin-bottom:16px">Deslizá para leerlas.</p><div class="car" id="car" onscroll="A.cscroll()">'+LESSONS.map(function(l,i){return '<div class="slide" style="--c1:'+l[3]+';--c2:'+l[4]+'"><div><div class="em">'+l[0]+'</div><h3>'+esc(l[1])+'</h3><p>'+esc(l[2])+'</p></div><div class="n">'+(i+1)+' de '+LESSONS.length+'</div></div>'}).join('')+'</div><div class="dotsr" id="cdots"></div><div class="row" style="justify-content:center;margin-top:14px"><button class="btn ghost" onclick="A.cgo(-1)">‹ Anterior</button><button class="btn" onclick="A.cgo(1)">Siguiente ›</button></div>'+'<div class="sec">'+quoteHTML(3)+'</div>';A.cscroll()};
A.cscroll=function(){var c=$('car');if(!c)return;var w=c.firstChild.offsetWidth+14,i=Math.max(0,Math.min(LESSONS.length-1,Math.round(c.scrollLeft/w)));$('cdots').innerHTML=LESSONS.map(function(l,k){return '<i class="'+(k===i?'on':'')+'"></i>'}).join('')};
A.cgo=function(n){var c=$('car');c.scrollBy({left:n*(c.firstChild.offsetWidth+14),behavior:'smooth'})};

/* ---------- DIARIO ---------- */
VIEWS.diary=function(){
 var moods=['😄','🙂','😐','😴','🤩'];
 var refl=REFL.map(function(q,i){return '<div class="card" style="margin-bottom:10px"><p style="font-weight:700;margin-bottom:8px">'+esc(q)+'</p><textarea placeholder="Escribí acá…" oninput="A.refl('+i+',this.value)">'+esc(S.reflex[i]||'')+'</textarea></div>'}).join('');
 var es=S.diary.slice().reverse().map(function(e){var dt;try{dt=new Date(e.date+'T12:00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}catch(x){dt=e.date}return '<div class="entry"><div class="eh"><span>'+esc(dt)+' '+(e.mood||'')+'</span><button class="ico" aria-label="Borrar" onclick="A.ddel('+e.id+')">🗑</button></div><p>'+esc(e.text)+'</p></div>'}).join('');
 $('v-diary').innerHTML='<h1 style="font-size:2.2rem;margin-bottom:6px">Mi diario</h1><p class="muted" style="margin-bottom:16px">Anotá qué probaste, qué cambiaste y cómo te sentiste. Se guarda en este dispositivo.</p>'
 +'<div class="card"><p style="font-weight:700">¿Cómo te fue hoy?</p><div class="mood">'+moods.map(function(m){return '<button class="'+(S.mood===m?'on':'')+'" onclick="A.dmood(\''+m+'\')">'+m+'</button>'}).join('')+'</div><textarea id="dtext" placeholder="Hoy preparé… me gustó… la próxima vez le pondría…"></textarea><div class="row" style="margin-top:12px"><button class="btn" onclick="A.dsave()">Guardar entrada</button></div></div>'
 +'<div class="sec"><h2>Entradas</h2>'+(es||'<div class="card" style="text-align:center"><p class="muted">Todavía no escribiste nada. Tu primera entrada te espera arriba.</p></div>')+'</div>'
 +'<div class="sec"><h2>Para pensar</h2>'+refl+'</div>'};
A.dmood=function(m){S.mood=S.mood===m?'':m;var t=($('dtext')||{}).value||'';VIEWS.diary();$('dtext').value=t};
A.dsave=function(){var t=$('dtext').value.trim();if(!t){toast('Escribí algo primero');return}S.diary.push({id:Date.now(),date:iso(),mood:S.mood,text:t});LS.set('diary',S.diary);S.mood='';VIEWS.diary();toast('📔 Entrada guardada')};
A.ddel=function(id){S.diary=S.diary.filter(function(e){return e.id!==id});LS.set('diary',S.diary);VIEWS.diary()};
A.refl=function(i,v){S.reflex[i]=v;LS.set('reflex',S.reflex)};

/* ---------- TEST ---------- */
VIEWS.test=function(){
 var t=S.test;var h='<h1 style="font-size:2.2rem;margin-bottom:6px">Test del día</h1>';
 if(S.started||!t){
  var q=TESTQ[S.tstep];h+='<p class="muted" style="margin-bottom:12px">Tres preguntas y te decimos qué jugo te pide el día.</p><div class="qbar"><i style="width:'+(S.tstep/TESTQ.length*100)+'%"></i></div><h2 style="font-size:1.5rem;margin-bottom:14px">'+esc(q.q)+'</h2>'+q.o.map(function(o,i){return '<button class="opt" onclick="A.tans('+i+')"><span style="font-size:1.6rem">'+o[0]+'</span>'+esc(o[1])+'</button>'}).join('')}
 else{var code=(t&&t.code)||'ENE';var pool=R.filter(function(r){return r.c===code&&r.e===seasonNow()});if(pool.length<3)pool=R.filter(function(r){return r.c===code});var t0=todayDia(),pick=[];for(var i=0;i<3;i++)pick.push(pool[(t0+i*7)%pool.length]);
  h+='<div class="today" style="--c:'+CAT[code].col+';margin-top:10px"><span class="eyebrow">Tu resultado</span><h2>Hoy te toca: '+esc(RESNAME[code])+'</h2><p class="muted">Estas recetas son de '+D.ESTS[seasonNow()].toLowerCase()+' y van con tu momento.</p></div><div style="margin-top:16px">'+pick.map(function(r){return rcard(r)}).join('')+'</div><div class="row" style="margin-top:12px"><button class="btn" onclick="A.tretry()">Repetir el test</button></div>'}
 $('v-test').innerHTML=h};
A.tans=function(i){var o=TESTQ[S.tstep].o[i][2];S.tans.push(o);S.tstep++;if(S.tstep>=TESTQ.length){S.started=false;var sc={};S.tans.forEach(function(a){for(var k in a)sc[k]=(sc[k]||0)+a[k]});var best='ENE',b=-1;for(var k in sc){if(sc[k]>b){b=sc[k];best=k}}S.test={code:best,date:iso()};LS.set('test',S.test)}VIEWS.test();window.scrollTo(0,0)};
A.tretry=function(){S.tstep=0;S.tans=[];S.started=true;VIEWS.test()};

/* ---------- arranque ---------- */
buildNav();applyTheme();progress();
A.go('home',true);
try{if(sessionStorage.getItem('ujcd_w'))$('welcome').classList.add('hidden')}catch(e){}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){A.close();A.closeMore()}});
</script>
